name: Створення архіву релізу

on:
  push:
    branches: [ "main", "master" ] # Оновлює архів при кожному збереженні змін у коді

jobs:
  upload-assets:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дає право оновлювати та перезаписувати файли в релізах

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Створюємо чистий ZIP-архів сайту погоди (без службового сміття та демо-відео)
      - name: Create ZIP archive
        run: |
          zip -r WeatherInUkraine.zip . -x "*.git*" ".github*" "*demo.mp4*"

      # Автоматично завантажуємо та перезаписуємо архів у релізі "latest"
      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: WeatherInUkraine.zip
          name: WeatherInUkraine Latest Build
          tag_name: stable
          make_latest: true
          prerelease: false
          body: |
            ## 🌤️ Актуальний архів сайту погоди
            Цей ZIP-архів оновлюється **автоматично** при кожному пуші в репозиторій.

            ⏱️ _Останнє оновлення: ${{ github.event.head_commit.message }} (коміт ${{ github.sha }})_
