name: Deploy Static Website

on:
  push:
    branches: ["main"] # Запускати деплой при кожному пуші в гілку main
  workflow_dispatch:   # Дозволяє запускати пайплайн вручну через сайт GitHub

# Надання необхідних прав для GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    # 1. Копіюємо файли репозиторію на віртуальну машину
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Налаштовуємо середовище GitHub Pages
    - name: Setup Pages
      uses: actions/configure-pages@v5

    # 3. Запаковуємо корінь проєкту (крапка '.' означає поточну кореневу папку)
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    # 4. Публікуємо сайт в інтернеті
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
