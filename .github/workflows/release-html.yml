name: Automated Weather Application Release

on:
  push:
    branches: [ "main", "master" ]

jobs:
  release:
    name: Update Latest Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 1. Витягуємо саме версію додатку (першу комбінацію цифр після "Версія:")
      - name: Extract HTML Modification Version
        id: sync_version
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            
            // Шукаємо рядок 'Версія:' та забираємо першу комбінацію цифр (наприклад, 1.7.0)
            const match = html.match(/Версія:\s*([\d.]+)/i);
            
            if (!match) {
              console.error('Помилка: Не вдалося знайти версію додатку в index.html!');
              process.exit(1);
            }
            
            const modVersion = match[1];
            console.log('Знайдено версію вебдодатка сторінки:', modVersion);
            
            // Передаємо змінну далі в GitHub Actions
            fs.appendFileSync(process.env.GITHUB_ENV, 'EXT_VERSION=' + modVersion + '\n');
          "

      # 2. Створюємо чистий ZIP-архів з кодом сайту WeatherInUkraine
      - name: Create Clean App ZIP
        run: |
          zip -r weather-ukraine-v${{ env.EXT_VERSION }}.zip . -x "*.git*" ".github*" "weather-ukraine-*.zip"

      # 3. Публікуємо актуальний реліз вебдодатка
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: weather-ukraine-v${{ env.EXT_VERSION }}.zip
          name: WeatherInUkraine Build v${{ env.EXT_VERSION }}
          tag_name: latest
          make_latest: "true"
          prerelease: false
          overwrite: true
          body: |
            ## 🌤️ Актуальна стабільна збірка додатка WeatherInUkraine
            Поточна версія сторінки: **v${{ env.EXT_VERSION }}** (WeatherScope Pro).

            ⏱️ _Останні зміни: ${{ github.event.head_commit.message }} (коміт ${{ github.sha }})_

            ### 📦 Інструкція:
            Цей архів містить повну резервну копію коду для версії **v${{ env.EXT_VERSION }}**. 
            Ви можете завантажити його для локального тестування або розгортання вебсторінки на власному хостингу.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
